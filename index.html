<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動默書小幫手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 頂部標題列 -->
    <header class="w-full max-w-md bg-blue-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between mb-6">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🎓</span>
            <h1 class="text-xl font-bold">自動默書小幫手</h1>
        </div>
        <span class="text-xs bg-blue-500 px-2.5 py-1 rounded-full font-medium">專業版</span>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-md flex-1 flex flex-col">

        <!-- 畫面 1：準備默書 -->
        <div id="setup-screen" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <h2 class="text-lg font-bold text-slate-800">準備默書</h2>

            <!-- 語言切換選擇 -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">選擇默書科目／語言</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btn-lang-en" class="py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-blue-600 text-white shadow-xs">
                        🇬🇧 英文默書
                    </button>
                    <button type="button" id="btn-lang-zh" class="py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-white text-slate-700 border border-slate-200">
                        🇭🇰 中文（粵語）默書
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <p id="input-hint" class="text-sm text-slate-500">請在下方貼上英文詞彙或句子，每行一個或用換行分隔。<br><span class="text-blue-500 font-medium">（自動識別：拍攝課本印刷字或手寫作業）</span></p>
                <div class="flex space-x-1.5 flex-shrink-0">
                    <button type="button" id="btn-select-all" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1 rounded-lg transition">全選</button>
                    <button type="button" id="btn-clear-all" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-2.5 py-1 rounded-lg transition">清除內容</button>
                </div>
            </div>

            <div class="relative">
                <textarea id="input-words" rows="6" class="w-full p-3.5 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm leading-relaxed" placeholder="1. The children are playing Frisbee.&#10;2. They play tug of war, and hide-and-seek."></textarea>
            </div>

            <!-- Gemini 視覺載入進度提示框 -->
            <div id="ocr-status-container" class="hidden bg-blue-50 border border-blue-100 p-3.5 rounded-xl">
                <div class="flex items-center space-x-2 mb-1.5">
                    <span id="ocr-status-text" class="text-xs font-semibold text-blue-700">Gemini 正在智慧解析圖片文字...</span>
                </div>
                <p id="ocr-status-detail" class="text-[10px] text-blue-600 leading-relaxed"></p>
                <div id="ocr-retry-container" class="hidden mt-2">
                    <button type="button" id="btn-ocr-retry" class="text-[10px] bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1 rounded-md transition">重試一次</button>
                </div>
            </div>

            <!-- 拍照與相冊選擇按鈕區 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="relative overflow-hidden">
                    <input type="file" id="camera-upload" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <button type="button" class="w-full border-2 border-dashed border-slate-200 hover:border-blue-400 bg-slate-50 text-slate-700 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs pointer-events-none">
                        <span>📷 現場拍照辨識</span>
                    </button>
                </div>

                <div class="relative overflow-hidden">
                    <input type="file" id="gallery-upload" accept="image/*" multiple class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <button type="button" class="w-full border-2 border-dashed border-slate-200 hover:border-blue-400 bg-slate-50 text-slate-700 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs pointer-events-none">
                        <span>🖼️ 上傳多張相片</span>
                    </button>
                </div>
            </div>

            <!-- 首頁直接跳轉批改頁按鈕 -->
            <div>
                <button type="button" id="btn-goto-grading" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-3 px-4 rounded-xl transition shadow-xs flex items-center justify-center space-x-2 text-xs">
                    <span>✨ 直接跳轉到 AI 批改頁（需選字欄有內容）</span>
                </button>
            </div>

            <!-- 文字儲存與歷史紀錄管理區 -->
            <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-700">儲存與歷史默書清單</span>
                    <button type="button" id="btn-save-current" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">儲存當前內容</button>
                </div>
                <div id="saved-lists-container" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-400 text-center py-2">尚未儲存任何默書內容</p>
                </div>
            </div>

            <!-- 設定選項 -->
            <div class="space-y-3 pt-2 border-t border-slate-100">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">讀字速度</label>
                <select id="speech-speed" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none">
                    <option value="0.3">極慢速 (0.3x)</option>
                    <option value="0.5" selected>超慢速 (0.5x - 預設)</option>
                    <option value="0.7">慢慢讀 (0.7x)</option>
                    <option value="1.0">正常 (1.0x)</option>
                    <option value="1.2">快些 (1.2x)</option>
                </select>
            </div>

            <button type="button" id="btn-start" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-md shadow-blue-200 flex items-center justify-center space-x-2">
                <span>▶ 開始默書</span>
            </button>
        </div>

        <!-- 畫面 2：默書進行中 -->
        <div id="dictation-screen" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <span id="progress-indicator" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">第 1 段 / 共 5 段</span>
                <button type="button" id="btn-back-setup" class="text-xs text-slate-400 hover:text-slate-600 font-medium">返回設定</button>
            </div>

            <div class="flex flex-col items-center justify-center py-4 space-y-3">
                <button type="button" id="btn-play-word" class="w-24 h-24 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-full flex items-center justify-center transition shadow-inner">
                    <span class="text-4xl">🔊</span>
                </button>
                <span class="text-xs font-medium text-slate-500">點擊喇叭即可「重播一次」</span>
            </div>

            <!-- 控制按鈕區：上一步與下一步 -->
            <div class="grid grid-cols-2 gap-2">
                <button type="button" id="btn-prev-sentence" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-3 rounded-xl transition text-xs flex items-center justify-center space-x-1">
                    <span>⬅ 播回上一段</span>
                </button>
                <button type="button" id="btn-next-sentence" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-3 rounded-xl transition shadow-md shadow-blue-200 text-xs flex items-center justify-center space-x-1">
                    <span>播下一段 ➔</span>
                </button>
            </div>

            <!-- 最後一段專屬：全文快速檢查播放按鈕 -->
            <div id="full-review-container" class="hidden pt-1">
                <button type="button" id="btn-full-review" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 font-semibold py-3 px-4 rounded-xl transition text-xs flex items-center justify-center space-x-1.5">
                    <span>🔄 全文快速播放一次檢查</span>
                </button>
            </div>
        </div>

        <!-- 畫面 3：結算畫面 -->
        <div id="result-screen" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <div class="text-center py-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    ✓
                </div>
                <h2 class="text-xl font-bold text-slate-800">完成默書！</h2>
                <p id="result-summary" class="text-sm text-slate-500 mt-1">表現優秀！</p>
            </div>

            <!-- AI 拍照紅筆批改區 -->
            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl space-y-3">
                <div class="flex items-center space-x-2 text-indigo-900 font-semibold text-sm">
                    <span>✨ Gemini 拍照紅筆批改與比對</span>
                </div>
                <p class="text-xs text-indigo-600 leading-relaxed">請將學童手寫默書作業拍照或上傳多張相片，AI 將自動與標準答案比對並標註錯別字。</p>

                <!-- 拍照與上傳按鈕 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative overflow-hidden">
                        <input type="file" id="grading-camera" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                        <button type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-xl transition text-xs flex items-center justify-center space-x-1.5 pointer-events-none">
                            <span>📸 連續拍照批改</span>
                        </button>
                    </div>

                    <div class="relative overflow-hidden">
                        <input type="file" id="grading-gallery" accept="image/*" multiple class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                        <button type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-xl transition text-xs flex items-center justify-center space-x-1.5 pointer-events-none">
                            <span>🖼️ 上傳多張相片</span>
                        </button>
                    </div>
                </div>

                <!-- 已拍攝/上傳相片預覽清單 -->
                <div id="grading-preview-container" class="hidden space-y-2 pt-1">
                    <p class="text-[11px] font-semibold text-indigo-800">已選取 <span id="grading-photo-count">0</span> 張作業相片（按選擇順序排列）：</p>
                    <div id="grading-thumbnails" class="flex flex-wrap gap-2"></div>
                    <button type="button" id="btn-submit-grading" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl transition text-xs">
                        ✨ 開始執行 AI 紅筆批改
                    </button>
                </div>

                <!-- 批改狀態指示 -->
                <div id="grading-status-container" class="hidden bg-indigo-50 border border-indigo-200 p-3 rounded-xl mt-2">
                    <div class="flex items-center space-x-2 mb-1.5">
                        <span id="grading-status-text" class="text-xs font-semibold text-indigo-700">AI 正在批改中...</span>
                    </div>
                    <p id="grading-status-detail" class="text-[10px] text-indigo-600 leading-relaxed"></p>
                    <div id="grading-retry-container" class="hidden mt-2">
                        <button type="button" id="btn-grading-retry" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1 rounded-md transition">重試一次</button>
                    </div>
                </div>
            </div>

            <!-- AI 批改結果顯示區 -->
            <div id="grading-result-container" class="hidden bg-white border border-slate-200 p-4 rounded-xl space-y-3 fade-in">
                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center justify-between">
                    <span>AI 紅筆批改報告</span>
                    <span id="grading-score" class="text-rose-600 font-bold text-sm"></span>
                </h3>
                <div id="grading-details" class="text-xs text-slate-700 space-y-2 max-h-60 overflow-y-auto leading-relaxed"></div>
            </div>

            <div class="flex space-x-3 pt-2">
                <button type="button" id="btn-retry-all" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl transition text-sm">
                    全部重默
                </button>
            </div>
            <button type="button" id="btn-restart" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition text-sm">
                返回首頁重新開始
            </button>
        </div>

    </main>

    <!-- 訊息提示框 -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl text-center space-y-4">
            <p id="modal-message" class="text-sm text-slate-700 font-medium">提示訊息</p>
            <button type="button" id="modal-close" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-medium text-sm">確定</button>
        </div>
    </div>

    <script>
        const GEMINI_MODELS = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.0-flash"];
        const STORAGE_KEY = 'my_dictation_saved_lists_v22';
        let currentLanguage = 'en';

        const setupScreen = document.getElementById('setup-screen');
        const dictationScreen = document.getElementById('dictation-screen');
        const resultScreen = document.getElementById('result-screen');
        const inputWords = document.getElementById('input-words');
        const inputHint = document.getElementById('input-hint');
        const btnLangEn = document.getElementById('btn-lang-en');
        const btnLangZh = document.getElementById('btn-lang-zh');

        const btnStart = document.getElementById('btn-start');
        const btnGotoGrading = document.getElementById('btn-goto-grading');
        const cameraUpload = document.getElementById('camera-upload');
        const galleryUpload = document.getElementById('gallery-upload');
        const ocrStatusContainer = document.getElementById('ocr-status-container');
        const ocrStatusText = document.getElementById('ocr-status-text');
        const ocrStatusDetail = document.getElementById('ocr-status-detail');
        const ocrRetryContainer = document.getElementById('ocr-retry-container');
        const btnOcrRetry = document.getElementById('btn-ocr-retry');
        const speechSpeedSelect = document.getElementById('speech-speed');

        const btnSelectAll = document.getElementById('btn-select-all');
        const btnClearAll = document.getElementById('btn-clear-all');
        const gradingCamera = document.getElementById('grading-camera');
        const gradingGallery = document.getElementById('grading-gallery');
        const gradingPreviewContainer = document.getElementById('grading-preview-container');
        const gradingPhotoCount = document.getElementById('grading-photo-count');
        const gradingThumbnails = document.getElementById('grading-thumbnails');
        const btnSubmitGrading = document.getElementById('btn-submit-grading');

        const gradingStatusContainer = document.getElementById('grading-status-container');
        const gradingStatusText = document.getElementById('grading-status-text');
        const gradingStatusDetail = document.getElementById('grading-status-detail');
        const gradingRetryContainer = document.getElementById('grading-retry-container');
        const btnGradingRetry = document.getElementById('btn-grading-retry');
        const gradingResultContainer = document.getElementById('grading-result-container');
        const gradingScore = document.getElementById('grading-score');
        const gradingDetails = document.getElementById('grading-details');

        const progressIndicator = document.getElementById('progress-indicator');
        const btnPlayWord = document.getElementById('btn-play-word');
        const btnPrevSentence = document.getElementById('btn-prev-sentence');
        const btnNextSentence = document.getElementById('btn-next-sentence');
        const fullReviewContainer = document.getElementById('full-review-container');
        const btnFullReview = document.getElementById('btn-full-review');
        const btnBackSetup = document.getElementById('btn-back-setup');
        const resultSummary = document.getElementById('result-summary');
        const btnRetryAll = document.getElementById('btn-retry-all');
        const btnRestart = document.getElementById('btn-restart');

        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const modalClose = document.getElementById('modal-close');
        const btnSaveCurrent = document.getElementById('btn-save-current');
        const savedListsContainer = document.getElementById('saved-lists-container');

        let originalWords = [];
        let dictationQueue = [];
        let currentQueueIndex = 0;

        let pendingFiles = [];
        let currentFileIndex = 0;
        let accumulatedOCRTextResults = [];
        let lastOcrContext = null;
        let gradingQueueFiles = [];

        window.addEventListener('DOMContentLoaded', () => {
            renderSavedLists();
            setLanguage('en');
        });

        function setLanguage(lang) {
            currentLanguage = lang;
            if (lang === 'en') {
                btnLangEn.className = "py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-blue-600 text-white shadow-xs";
                btnLangZh.className = "py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-white text-slate-700 border border-slate-200";
                inputHint.innerHTML = "請在下方貼上英文詞彙或句子，每行一個或用換行分隔。<br><span class=\"text-blue-500 font-medium\">（自動識別：拍攝課本印刷字或手寫作業）</span>";
                inputWords.placeholder = "1. The children are playing Frisbee.\n2. They play tug of war, and hide-and-seek.";
            } else {
                btnLangZh.className = "py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-blue-600 text-white shadow-xs";
                btnLangEn.className = "py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-white text-slate-700 border border-slate-200";
                inputHint.innerHTML = "請在下方貼上中文詞語或句子，支援以每個標點符號（，、。！？；）自動分句換行。<br><span class=\"text-blue-500 font-medium\">（自動識別：拍攝課本印刷字或手寫作業）</span>";
                inputWords.placeholder = "1. 星期三下午，我上了一節難忘的體育課，讓我比以前更愛上體育課。";
            }
        }

        function showAlert(msg) {
            modalMessage.innerText = msg;
            customModal.classList.remove('hidden');
        }
        modalClose.addEventListener('click', () => customModal.classList.add('hidden'));

        btnLangEn.addEventListener('click', () => setLanguage('en'));
        btnLangZh.addEventListener('click', () => setLanguage('zh'));

        function loadSavedLists() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }
        function saveListsToStorage(lists) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
        }

        function renderSavedLists() {
            const lists = loadSavedLists();
            if (lists.length === 0) {
                savedListsContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">尚未儲存任何默書內容</p>';
                return;
            }

            savedListsContainer.innerHTML = '';
            lists.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-white border border-slate-200 p-2 rounded-lg";

                const titleSpan = document.createElement('span');
                titleSpan.className = "text-xs font-medium text-slate-700 truncate flex-1 mr-2 cursor-pointer";
                titleSpan.innerText = (item.lang === 'zh' ? '【中文】' : '【英文】') + ' ' + item.title;
                titleSpan.addEventListener('click', () => {
                    inputWords.value = item.content;
                    if (item.lang) setLanguage(item.lang);
                    showAlert("已成功載入：「" + item.title + "」");
                });

                const btnDel = document.createElement('button');
                btnDel.type = "button";
                btnDel.className = "text-slate-400 hover:text-rose-500 text-xs px-1.5 py-0.5 rounded";
                btnDel.innerHTML = "✕";
                btnDel.addEventListener('click', (e) => {
                    e.stopPropagation();
                    let currentLists = loadSavedLists();
                    currentLists.splice(index, 1);
                    saveListsToStorage(currentLists);
                    renderSavedLists();
                });

                div.appendChild(titleSpan);
                div.appendChild(btnDel);
                savedListsContainer.appendChild(div);
            });
        }

        btnSaveCurrent.addEventListener('click', () => {
            const text = inputWords.value.trim();
            if (!text) return showAlert("沒有內容可供儲存！");
            const firstLine = text.split('\n')[0].trim();
            const defaultTitle = firstLine.length > 20 ? firstLine.substring(0, 20) + '...' : (firstLine || '未命名默書');
            let titleName = prompt("請輸入此篇默書的標題名稱：", defaultTitle);
            if (!titleName) return;
            let lists = loadSavedLists();
            lists.unshift({ id: Date.now(), title: titleName.trim(), content: text, lang: currentLanguage });
            if (lists.length > 20) lists.pop();
            saveListsToStorage(lists);
            renderSavedLists();
            showAlert("「" + titleName + "」已成功儲存！");
        });

        let isAllSelected = false;
        btnSelectAll.addEventListener('click', () => {
            inputWords.focus();
            if (!isAllSelected) {
                inputWords.select();
                btnSelectAll.innerText = "取消全選";
                isAllSelected = true;
            } else {
                inputWords.setSelectionRange(inputWords.value.length, inputWords.value.length);
                btnSelectAll.innerText = "全選";
                isAllSelected = false;
            }
        });

        btnClearAll.addEventListener('click', () => {
            if (inputWords.value.trim() === '') return;
            if (confirm("確定要清除全部文字嗎？")) {
                inputWords.value = '';
                isAllSelected = false;
                btnSelectAll.innerText = "全選";
            }
        });

        cameraUpload.addEventListener('change', handleImageUpload);
        galleryUpload.addEventListener('change', handleImageUpload);

        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            pendingFiles = Array.from(files);
            currentFileIndex = 0;
            accumulatedOCRTextResults = [];
            e.target.value = '';

            showOcrStatus("正在分析相片...", "正在辨識第 1 張 / 共 " + pendingFiles.length + " 張相片...", false);
            processNextFileDirectOCR();
        }

        function processNextFileDirectOCR() {
            if (currentFileIndex >= pendingFiles.length) {
                hideOcrStatus();
                if (accumulatedOCRTextResults.length > 0) {
                    reindexAndAppendText(accumulatedOCRTextResults.join('\n'));
                } else {
                    showAlert("未能從相片中辨識出文字。");
                }
                return;
            }

            const file = pendingFiles[currentFileIndex];
            showOcrStatus("正在分析相片...", "正在辨識第 " + (currentFileIndex + 1) + " 張 / 共 " + pendingFiles.length + " 張...", false);

            const reader = new FileReader();
            reader.onload = (event) => {
                const base64Full = event.target.result;
                const base64Data = base64Full.split(',')[1];
                const mimeType = file.type || "image/jpeg";

                lastOcrContext = { base64Data: base64Data, mimeType: mimeType };

                callGeminiOCRData(base64Data, mimeType).then((result) => {
                    if (result.success) {
                        accumulatedOCRTextResults.push(formatOCRResultText(result.text));
                        currentFileIndex++;
                        processNextFileDirectOCR();
                    } else {
                        showOcrStatus("辨識失敗：" + result.error.title, result.error.detail, true);
                    }
                }).catch(() => {
                    showOcrStatus("網路連線失敗", "無法連線到伺服器。", true);
                });
            };
            reader.onerror = () => {
                currentFileIndex++;
                processNextFileDirectOCR();
            };
            reader.readAsDataURL(file);
        }

        function formatOCRResultText(text) {
            const lines = text.split('\n');
            let cleaned = [];
            lines.forEach(line => {
                let l = line.trim();
                if (l) cleaned.push(l.replace(/^\d+[\.\)]\s*/, ''));
            });
            return cleaned.join('\n');
        }

        btnOcrRetry.addEventListener('click', () => {
            if (!lastOcrContext) return;
            showOcrStatus("正在重試...", "重新傳送圖片到 API 進行辨識", false);
            callGeminiOCRData(lastOcrContext.base64Data, lastOcrContext.mimeType).then((result) => {
                if (result.success) {
                    accumulatedOCRTextResults.push(formatOCRResultText(result.text));
                    hideOcrStatus();
                    currentFileIndex++;
                    processNextFileDirectOCR();
                } else {
                    showOcrStatus("重試仍失敗：" + result.error.title, result.error.detail, true);
                }
            }).catch(() => {
                showOcrStatus("網路連線失敗", "無法連線到伺服器。", true);
            });
        });

        async function callGeminiOCRData(base64Data, mimeType) {
            const systemPrompt = currentLanguage === 'zh' ?
                "You are an expert Chinese teacher in Hong Kong. Look at the image: if it is a textbook or printed passage, extract the printed text. If it is handwritten, extract the handwriting. Extract clean dictation sentences or vocabulary. Output ONLY a clean numbered list sorted strictly in ascending numeric order (1., 2., 3., ...)." :
                "You are an expert English teacher in Hong Kong. Look at the image: if it is a textbook or printed passage, extract the printed text. If it is handwritten, extract the handwriting. Extract clean dictation sentences. Output ONLY a clean numbered list sorted strictly in ascending numeric order (1., 2., 3., ...).";

            for (let mi = 0; mi < GEMINI_MODELS.length; mi++) {
                const model = GEMINI_MODELS[mi];
                const apiUrl = "/api/chat";

                const body = JSON.stringify({
                    model: model,
                    contents: [{
                        role: "user",
                        parts: [
                            { text: "Extract and format the dictation list from this image (distinguish printed text vs handwritten as appropriate)." },
                            { inlineData: { mimeType: mimeType || "image/jpeg", data: base64Data } }
                        ]
                    }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                });

                let retries = 3;
                let response = null;
                while (retries > 0) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: body
                        });
                        if (response.ok) break;
                        if (response.status === 503 || response.status === 429) {
                            retries--;
                            await new Promise(r => setTimeout(r, 2000));
                            continue;
                        }
                        break;
                    } catch (e) {
                        retries--;
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }

                if (response && response.ok) {
                    const apiResult = await response.json();
                    const candidate = apiResult.candidates && apiResult.candidates[0];
                    if (candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text) {
                        let aiText = candidate.content.parts[0].text.trim().replace(/^```\w*\s*/i, '').replace(/\s*```$/, '');
                        if (aiText) return { success: true, text: aiText };
                    }
                }
            }
            return { success: false, error: { title: "伺服器忙碌", detail: "請點擊重試按鈕再試一次。" } };
        }

        function reindexAndAppendText(newTextString) {
            const existingText = inputWords.value.trim();
            let allLines = existingText ? existingText.split('\n') : [];
            let newLines = newTextString.split('\n');
            let combined = allLines.concat(newLines);
            let cleanList = [];

            combined.forEach(line => {
                let l = line.replace(/^\d+[\.\)]\s*/, '').trim();
                if (l) cleanList.push(l);
            });

            let formatted = cleanList.map((item, idx) => (idx + 1) + ". " + item);
            inputWords.value = formatted.join('\n');
            hideOcrStatus();
            showAlert("Gemini 識別成功！已順利載入 " + cleanList.length + " 個句子。");
        }

        function showOcrStatus(title, detail, showRetry) {
            ocrStatusContainer.classList.remove('hidden');
            ocrStatusText.innerText = title;
            ocrStatusDetail.innerText = detail || "";
            if (showRetry) ocrRetryContainer.classList.remove('hidden');
            else ocrRetryContainer.classList.add('hidden');
        }
        function hideOcrStatus() {
            ocrStatusContainer.classList.add('hidden');
            ocrRetryContainer.classList.add('hidden');
        }

        function parseTextToQueue(rawText) {
            let rawLines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let queue = [];
            rawLines.forEach(line => {
                let cleanLine = line.replace(/^\d+[\.\)]\s*/, '').trim();
                if (!cleanLine) return;

                if (currentLanguage === 'zh') {
                    // 中文：完美復原以前用標點符號（，、。！？；）做換行與短句分隔的邏輯
                    let parts = cleanLine.split(/([，、。！？；]+(?:\s+|$))/);
                    let currentSeg = "";
                    for (let i = 0; i < parts.length; i++) {
                        currentSeg += parts[i];
                        if (i % 2 === 1) {
                            if (currentSeg.trim().length > 0) {
                                queue.push(currentSeg.trim());
                            }
                            currentSeg = "";
                        }
                    }
                    if (currentSeg.trim().length > 0) {
                        queue.push(currentSeg.trim());
                    }
                } else {
                    // 英文：根據句號、問號、驚嘆號等切分
                    let parts = cleanLine.split(/([,.?!;]+(?:\s+|$))/);
                    let currentSeg = "";
                    for (let i = 0; i < parts.length; i++) {
                        currentSeg += parts[i];
                        if (i % 2 === 1) {
                            if (currentSeg.trim().length > 0) {
                                queue.push(currentSeg.trim());
                            }
                            currentSeg = "";
                        }
                    }
                    if (currentSeg.trim().length > 0) {
                        queue.push(currentSeg.trim());
                    }
                }
            });
            return queue;
        }

        async function callGeminiOCRData(base64Data, mimeType) {
            const systemPrompt = currentLanguage === 'zh' ?
                "You are an expert Chinese teacher in Hong Kong. Look at the image: extract Chinese dictation sentences or text passages. Ensure correct Chinese punctuation (，、。！？；). Output ONLY a clean numbered list sorted strictly in ascending numeric order (1., 2., 3., ...)." :
                "You are an expert English teacher in Hong Kong. Look at the image: extract clean dictation sentences. Output ONLY a clean numbered list sorted strictly in ascending numeric order (1., 2., 3., ...).";

            for (let mi = 0; mi < GEMINI_MODELS.length; mi++) {
                const model = GEMINI_MODELS[mi];
                const apiUrl = "/api/chat";

                const body = JSON.stringify({
                    model: model,
                    contents: [{
                        role: "user",
                        parts: [
                            { text: currentLanguage === 'zh' ? "Extract the Chinese dictation text list from this image." : "Extract the English dictation list from this image." },
                            { inlineData: { mimeType: mimeType || "image/jpeg", data: base64Data } }
                        ]
                    }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                });

                let retries = 3;
                let response = null;
                while (retries > 0) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: body
                        });
                        if (response.ok) break;
                        if (response.status === 503 || response.status === 429) {
                            retries--;
                            await new Promise(r => setTimeout(r, 2000));
                            continue;
                        }
                        break;
                    } catch (e) {
                        retries--;
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }

                if (response && response.ok) {
                    const apiResult = await response.json();
                    const candidate = apiResult.candidates && apiResult.candidates[0];
                    if (candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text) {
                        let aiText = candidate.content.parts[0].text.trim().replace(/^```\w*\s*/i, '').replace(/\s*```$/, '');
                        if (aiText) return { success: true, text: aiText };
                    }
                }
            }
            return { success: false, error: { title: "伺服器忙碌", detail: "請點擊重試按鈕再試一次。" } };
        }
