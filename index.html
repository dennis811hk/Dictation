<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="creative-medium" content="interactive-prototype">
    <title>自動默書小幫手 - 粵漢雙語全功能版</title>
    <!-- PWA 必要：載入 Manifest 檔案 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="pre connec" href="https://miaoda.feishu.cn">
    <link href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-start p-4">
    <!-- 頂部標題列 -->
    <header class="w-full max-w-md bg-blue-600 text-white p-4 rounded-2xl shadow-md flex items-center justify-between mb-6">
        <div class="flex items-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M12 14l9-5-9-5-9 5 9 5z" />
                <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            </svg>
            <h1 class="text-xl font-bold">自動默書小幫手</h1>
        </div>
        <span class="text-xs bg-blue-500 px-2.5 py-1 rounded-full font-medium">粵漢雙語 Pro 版</span>
    </header>
    <!-- 主要內容區 -->
    <main class="w-full max-w-md flex-1 flex flex-col">
        <!-- 畫面 1：準備默書 -->
        <div id="setup-screen" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <h2 class="text-lg font-bold text-slate-800">準備默書</h2>
            <!-- 語言切換選擇 -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">選擇默書科目／語言</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btn-lang-en" class="py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-blue-600 text-white shadow-xs">
                        🇬🇧 英文默書
                    </button>
                    <button type="button" id="btn-lang-zh" class="py-2.5 px-3 rounded-xl text-xs font-semibold transition bg-white text-slate-700 border border-slate-200">
                        🇭🇰 中文（粵語）默書
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <p id="input-hint" class="text-sm text-slate-500">請在下方貼上英文詞彙或句子，每行一個或用換行分隔。</p>
                <div class="flex space-x-1.5 flex-shrink-0">
                    <button type="button" id="btn-select-all" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2.5 py-1 rounded-lg transition">全選</button>
                    <button type="button" id="btn-clear-all" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-2.5 py-1 rounded-lg transition">清除內容</button>
                </div>
            </div>
            <div class="relative">
                <textarea id="input-words" rows="6" class="w-full p-3.5 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm leading-relaxed" placeholder="1. The children are playing Frisbee.
2. They play tug of war, and hide-and-seek."></textarea>
            </div>
            <!-- Gemini 視覺載入進度提示框 -->
            <div id="ocr-status-container" class="hidden bg-blue-50 border border-blue-100 p-3.5 rounded-xl shadow-xs">
                <div class="flex items-center space-x-2 mb-1.5">
                    <svg class="animate-spin h-4 w-4 text-blue-600 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span id="ocr-status-text" class="text-xs font-semibold text-blue-700">Gemini 正在智慧解析圖片文字...</span>
                </div>
                <p id="ocr-status-detail" class="text-[10px] text-blue-600 ml-6 leading-relaxed"></p>
                <div id="ocr-retry-container" class="hidden ml-6 mt-2">
                    <button type="button" id="btn-ocr-retry" class="text-[10px] bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1 rounded-md transition">重試一次</button>
                </div>
            </div>
            <!-- 拍照與相冊選擇按鈕區 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="relative overflow-hidden">
                    <input type="file" id="camera-upload" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <button type="button" class="w-full border-2 border-dashed border-slate-200 hover:border-blue-400 bg-slate-50 hover:bg-blue-50/50 text-slate-700 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>現場拍照辨識</span>
                    </button>
                </div>
                <div class="relative overflow-hidden">
                    <input type="file" id="gallery-upload" accept="image/*" multiple class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <button type="button" class="w-full border-2 border-dashed border-slate-200 hover:border-blue-400 bg-slate-50 hover:bg-blue-50/50 text-slate-700 font-medium py-3 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-xs pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span>上傳多張相片辨識</span>
                    </button>
                </div>
            </div>
            <!-- 首頁直接跳轉批改頁按鈕 -->
            <div>
                <button type="button" id="btn-goto-grading" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-3 px-4 rounded-xl transition shadow-xs flex items-center justify-center space-x-2 text-xs">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>直接跳轉到 AI 批改頁（需選字欄有內容）</span>
                </button>
            </div>
            <!-- 文字儲存與歷史紀錄管理區 -->
            <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-700 flex items-center space-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-600 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        儲存與歷史默書清單
                    </span>
                    <button type="button" id="btn-save-current" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-xs flex items-center space-x-1">
                        <span>儲存當前內容</span>
                    </button>
                </div>
                <div id="saved-lists-container" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-400 text-center py-2">尚未儲存任何默書內容</p>
                </div>
            </div>
            <!-- 設定選項 -->
            <div class="space-y-3 pt-2 border-t border-slate-100">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">讀字速度</label>
                <select id="speech-speed" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none">
                    <option value="0.3">極慢速 (0.3x)</option>
                    <option value="0.5" selected>超慢速 (0.5x - 預設)</option>
                    <option value="0.7">慢慢讀 (0.7x)</option>
                    <option value="1.0">正常 (1.0x)</option>
                    <option value="1.2">快些 (1.2x)</option>
                </select>
            </div>
            <button type="button" id="btn-start" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-md shadow-blue-200 flex items-center justify-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>開始默書</span>
            </button>
        </div>
        <!-- 畫面 2：默書進行中 -->
        <div id="dictation-screen" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <span id="progress-indicator" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">第 1 段 / 共 5 段</span>
                <button type="button" id="btn-back-setup" class="text-xs text-slate-400 hover:text-slate-600 font-medium">返回設定</button>
            </div>
            <div class="flex flex-col items-center justify-center py-4 space-y-3">
                <button type="button" id="btn-play-word" class="w-24 h-24 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-full flex items-center justify-center transition shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                </button>
                <span class="text-xs font-medium text-slate-500">點擊喇叭即可「重播一次」</span>
            </div>
            <!-- 控制按鈕區：上一步與下一步 -->
            <div class="grid grid-cols-2 gap-2">
                <button type="button" id="btn-prev-sentence" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-3 rounded-xl transition text-xs flex items-center justify-center space-x-1">
                    <span>⬅ 播回上一段</span>
                </button>
                <button type="button" id="btn-next-sentence" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-3 rounded-xl transition shadow-md shadow-blue-200 text-xs flex items-center justify-center space-x-1">
                    <span>播下一段 ➔</span>
                </button>
            </div>
            <!-- 最後一段專屬：全文快速檢查播放按鈕 -->
            <div id="full-review-container" class="hidden pt-1">
                <button type="button" id="btn-full-review" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 font-semibold py-3 px-4 rounded-xl transition text-xs flex items-center justify-center space-x-1.5 shadow-xs">
                    <span>🔄 全文快速播放一次檢查</span>
                </button>
            </div>
        </div>
        <!-- 畫面 3：結算畫面 -->
        <div id="result-screen" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col space-y-5">
            <div class="text-center py-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800">完成默書！</h2>
                <p id="result-summary" class="text-sm text-slate-500 mt-1">表現優秀！</p>
            </div>
            <!-- AI 拍照紅筆批改區（支援連續拍照與壓縮處理） -->
            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl space-y-3">
                <div class="flex items-center space-x-2 text-indigo-900 font-semibold text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Gemini 拍照紅筆批改與比對</span>
                </div>
                <p class="text-xs text-indigo-600 leading-relaxed">請將學童手寫默書作業拍照（支援連續拍攝多頁）或上傳多張相片，AI 將自動與標準答案比對並標註錯別字。</p>
                <!-- 拍照與上傳按鈕 -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative overflow-hidden">
                        <input type="file" id="grading-camera" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                        <button type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-xl transition shadow-sm text-xs flex items-center justify-center space-x-1.5 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <span>連續拍照批改 📸</span>
                        </button>
                    </div>
                    <div class="relative overflow-hidden">
                        <input type="file" id="grading-gallery" accept="image/*" multiple class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                        <button type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-xl transition shadow-sm text-xs flex items-center justify-center space-x-1.5 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span>上傳多張相片 🖼️</span>
                        </button>
                    </div>
                </div>
                <!-- 已拍攝/上傳相片預覽清單 -->
                <div id="grading-preview-container" class="hidden space-y-2 pt-1">
                    <p class="text-[11px] font-semibold text-indigo-800">已選取 <span id="grading-photo-count">0</span> 張作業相片：</p>
                    <div id="grading-thumbnails" class="flex flex-wrap gap-2"></div>
                    <button type="button" id="btn-submit-grading" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-xs text-xs flex items-center justify-center space-x-1">
                        <span>✨ 開始執行 AI 紅筆批改</span>
                    </button>
                </div>
                <!-- 批改狀態指示 -->
                <div id="grading-status-container" class="hidden bg-indigo-50 border border-indigo-200 p-3 rounded-xl mt-2">
                    <div class="flex items-center space-x-2 mb-1.5">
                        <svg class="animate-spin h-4 w-4 text-indigo-600 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span id="grading-status-text" class="text-xs font-semibold text-indigo-700">AI 正在批改中...</span>
                    </div>
                    <p id="grading-status-detail" class="text-[10px] text-indigo-600 ml-6 leading-relaxed"></p>
                    <div id="grading-retry-container" class="hidden ml-6 mt-2">
                        <button type="button" id="btn-grading-retry" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3 py-1 rounded-md transition">重試一次</button>
                    </div>
                </div>
            </div>
            <!-- AI 批改結果顯示區 -->
            <div id="grading-result-container" class="hidden bg-white border border-slate-200 p-4 rounded-xl space-y-3 fade-in">
                <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center justify-between">
                    <span>AI 紅筆批改報告</span>
                    <span id="grading-score" class="text-rose-600 font-bold text-sm"></span>
                </h3>
                <div id="grading-details" class="text-xs text-slate-700 space-y-2 max-h-60 overflow-y-auto leading-relaxed"></div>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="button" id="btn-retry-all" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4
